<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signup.css">
    <title>Task Manager - Sign Up</title>
</head>
<body>
    <div class="signup-container">
        <form id="signupForm" class="signup-form" action="process_signup.php" method="POST">
            <h2>Sign Up</h2>
            
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            <small id="nameError" class="error-message"></small>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <small id="emailError" class="error-message"></small>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" required>
            <small id="usernameError" class="error-message"></small>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>
            <small id="passwordError" class="error-message"></small>

            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
            <small id="confirmPasswordError" class="error-message"></small>

            <button type="submit">Sign Up</button>
            <p>Already have an account? <a href="login.html">Login</a></p>
        </form>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(event) {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();

            const nameError = document.getElementById('nameError');
            const emailError = document.getElementById('emailError');
            const usernameError = document.getElementById('usernameError');
            const passwordError = document.getElementById('passwordError');
            const confirmPasswordError = document.getElementById('confirmPasswordError');

           
            nameError.textContent = '';
            emailError.textContent = '';
            usernameError.textContent = '';
            passwordError.textContent = '';
            confirmPasswordError.textContent = '';

            let valid = true;

            
            if (name === '') {
                nameError.textContent = 'Full Name cannot be empty!';
                valid = false;
            }

            
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                emailError.textContent = 'Please enter a valid email address!';
                valid = false;
            }

            
            const usernamePattern = /^[a-zA-Z0-9_]{3,}$/;
            if (!usernamePattern.test(username)) {
                usernameError.textContent = 'Username must be at least 3 characters long and can only contain letters, numbers, and underscores!';
                valid = false;
            }

            
            const passwordPattern = /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{6,}$/;
            if (!passwordPattern.test(password)) {
                passwordError.textContent = 'Password must include at least one uppercase letter, one lowercase letter, one number, and one special character!';
                valid = false;
            }

            
            if (password !== confirmPassword) {
                confirmPasswordError.textContent = 'Passwords do not match!';
                valid = false;
            }

            if (!valid) {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
